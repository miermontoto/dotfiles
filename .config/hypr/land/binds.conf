# shortcuts de programas
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, hyprctl kill
bind = $mainMod, T, exec, /home/mier/dotfiles/.config/hypr/scripts/terminal-in-workspace-dir.sh
bind = $mainMod, W, exec, /home/mier/dotfiles/.config/hypr/scripts/duplicate-window.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, $browser
bind = $mainMod, space, exec, $menu
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, C, exec, $ide
bind = $mainMod, Z, exec, /home/mier/.local/bin/zed -n
bind = , print, exec, hyprshot -m region --freeze
bind = $mainMod, I, exec, 1password --show
bind = CTRL SHIFT, space, exec, 1password --quick-access
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, W, exec, killall waybar; waybar &

# mismos shortcuts pero en modo flotante
bind = $mainMod SHIFT, T, exec, [float] /home/mier/dotfiles/.config/hypr/scripts/terminal-in-workspace-dir.sh
bind = $mainMod SHIFT, E, exec, [float] $fileManager
bind = $mainMod SHIFT, F, exec, [float] $browser
bind = $mainMod SHIFT, C, exec, [float] $ide
bind = $mainMod SHIFT, Z, exec, [float] /home/mier/.local/bin/zed -n

# alt+tab con rofi
# bind = $mainMod, Tab, exec, /home/mier/dotfiles/.config/hypr/scripts/rofi-alt-tab.sh

# binds genéricas de dwindle
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# flechas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r
bind = $mainMod SHIFT, up, movewindow, mon:u
bind = $mainMod SHIFT, down, movewindow, mon:d

# redimensionar ventanas con alt+flechas
# binde = ALT, left, resizeactive, -50 0
# binde = ALT, right, resizeactive, 50 0
# binde = ALT, up, resizeactive, 0 -50
# binde = ALT, down, resizeactive, 0 50

# intercambiar ventanas tileadas con alt+shift+flechas
bind = ALT SHIFT, left, swapwindow, l
bind = ALT SHIFT, right, swapwindow, r
bind = ALT SHIFT, up, swapwindow, u
bind = ALT SHIFT, down, swapwindow, d

# nuevo workspace en el monitor activo
bind = $mainMod, N, workspace, empty
bind = $mainMod SHIFT, N, movetoworkspace, empty

# mover todas las ventanas del workspace actual a otro workspace
bind = $mainMod, M, exec, /home/mier/dotfiles/.config/hypr/scripts/move-all-windows.sh

# lista de tareas
bind = $mainMod, O, exec, bash $HOME/.config/waybar/scripts/todo.sh toggle

# renombrar workspace activo
bind = $mainMod, R, exec, workspace_id=$(hyprctl activeworkspace -j | jq '.id') && workspace_name=$(echo "" | rofi -dmenu -p "Workspace name:") && [ -n "$workspace_name" ] && hyprctl dispatch renameworkspace $workspace_id "$workspace_id: $workspace_name"

# renombrar terminal activa
bind = $mainMod, B, exec, /home/mier/dotfiles/.config/hypr/scripts/rename-terminal.sh

# asociar directorio al workspace actual
bind = $mainMod, D, exec, /home/mier/dotfiles/.config/hypr/scripts/set-workspace-dir.sh

# crear workspace completo para un repositorio (cursor + 2 terminales)
bind = $mainMod SHIFT, D, exec, /home/mier/dotfiles/.config/hypr/scripts/setup-repo-workspace.sh

# shortcuts de workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# magic
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# rueda de ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# lmb y rmb para ventanas
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# binds que no sé si hacen algo de verdad
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
